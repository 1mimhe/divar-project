# Local development database only: the app itself runs via `npm run dev`.
# Uses host port 27018 so it never clashes with another local Mongo on 27017.
services:
  mongo:
    image: mongo:8
    ports:
      - "27018:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodata:
