services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      MONGODB_URL: mongodb://mongo:27017/divar-store
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?set in .env}
      JWT_REFRESH_KEY: ${JWT_REFRESH_KEY:?set in .env}
      COOKIE_PRIVATE_KEY: ${COOKIE_PRIVATE_KEY:?set in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set in .env}
      SMS_PROVIDER: mock
      ADMIN_MOBILE: ${ADMIN_MOBILE:-}
    volumes:
      - uploads:/srv/app/public/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mongo:
    image: mongo:8
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  uploads:
  mongodata:
